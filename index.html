<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoGato | V 1.1 Corporativo</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --verde: #98ff98; --verde-dark: #76d376; --negro: #0a0a0a; --panel: #161616; --texto: #ffffff; --rojo: #ff4d4d; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--negro); color: var(--texto); overflow-x: hidden; }
        
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; background: #1a1a1a; color: var(--verde); border: 1px solid #333; outline: none; box-sizing: border-box; font-size: 1rem; }
        .btn-gato { background: var(--verde); color: #000; border: none; padding: 16px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 10px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-outline { background: transparent; border: 1px solid var(--verde); color: var(--verde); margin-top: 10px; }

        #auth-screen, #app-screen, #setup-profile, #admin-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        .container { width: 100%; max-width: 400px; }

        /* Dashboard */
        .card-saldo { background: linear-gradient(145deg, #161616, #000); padding: 25px; border-radius: 24px; border: 1px solid #222; text-align: center; margin-bottom: 20px; }
        .r-money { font-size: 2.8rem; font-weight: 800; color: var(--verde); }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* GatoCard */
        .gatocard { background: linear-gradient(135deg, #222 0%, #0a0a0a 100%); width: 100%; height: 210px; border-radius: 18px; padding: 25px; position: relative; border: 1px solid rgba(152,255,152,0.3); margin-top: 20px; box-sizing: border-box; }
        .chip { width: 45px; height: 35px; background: linear-gradient(to bottom right, #ffd700, #b8860b); border-radius: 6px; margin-bottom: 30px; }
        .card-num { font-family: 'Courier New', monospace; font-size: 1.2rem; letter-spacing: 2px; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--panel); padding: 30px; border-radius: 20px; border: 1px solid var(--verde); width: 100%; max-width: 380px; }
    </style>
</head>
<body onload="checkAuth()">

    <div id="auth-screen">
        <img src="https://i.postimg.cc/zXxLcyCv/1778560410678-(1).jpg" id="logo-gato" onclick="tripleClic()" style="max-width: 150px; margin-bottom: 20px; cursor: pointer;">
        <h2>BancoGato</h2>
        <div class="container">
            <input type="email" id="email" placeholder="Email de UQT">
            <input type="password" id="pass" placeholder="Tu Contraseña">
            <button class="btn-gato" onclick="iniciarSesion()">Entrar</button>
            <button class="btn-gato btn-outline" onclick="crearCuenta()">Crear Cuenta</button>
            <button id="btn-admin-gate" class="btn-gato btn-outline" style="opacity: 0.4;" onclick="accesoAdmin()">Admin</button>
        </div>
    </div>

    <div id="setup-profile" style="display:none;">
        <div class="container">
            <h2>Configura tu Perfil</h2>
            <input type="text" id="reg-nombre" placeholder="Tu Nombre">
            <input type="text" id="reg-apellido" placeholder="Tu Apellido">
            <input type="text" id="reg-alias" placeholder="Alias (Ej: GatoPerez)">
            <button class="btn-gato" onclick="completarRegistro()">Terminar Registro</button>
        </div>
    </div>

    <div id="app-screen" style="display:none;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span>Hola, <b id="user-name">...</b></span>
                <button onclick="logout()" style="color:var(--rojo); background:none; border:none; cursor:pointer;">Cerrar Sesión</button>
            </div>
            <div class="card-saldo">
                <div class="r-money">R$ <span id="saldo-val">0.00</span></div>
                <div style="font-size: 0.7rem; color: var(--verde);">ALIAS: <span id="user-alias">...</span></div>
            </div>
            <div class="grid-buttons">
                <button class="btn-gato mini-btn" onclick="alert('Funcionalidad de transferencia activa en Firebase')">💸 Transferir</button>
                <button class="btn-gato mini-btn" onclick="abrirModal('modal-uqtcard')">💳 Cargar UQT</button>
            </div>
            <div class="gatocard">
                <div class="chip"></div>
                <div class="card-num" id="card-number">7777 **** **** ****</div>
                <div style="display:flex; justify-content:space-between; margin-top:40px; font-size:0.7rem;">
                    <div id="card-holder">...</div>
                    <div>CVV: <span id="card-cvv">***</span></div>
                </div>
            </div>
        </div>
    </div>

    <div id="admin-screen" style="display:none;">
        <h2 style="color:var(--verde);">PANEL CONTROL ADRO CORP</h2>
        <div class="container">
            <div style="background: #111; padding: 15px; border-radius: 10px;">
                <h4>💵 Inyectar Fondos</h4>
                <input type="text" id="adm-id" placeholder="Alias">
                <input type="number" id="adm-monto" placeholder="R$">
                <button class="btn-gato" onclick="adminCargarSaldo()">Dar Dinero</button>
            </div>
            <button class="btn-gato btn-outline" onclick="location.reload()">Salir</button>
        </div>
    </div>

    <div id="modal-uqtcard" class="modal">
        <div class="modal-content">
            <h3>Cargar UQTCard</h3>
            <input type="email" id="uqt-email" placeholder="Email UQT">
            <input type="number" id="uqt-monto" placeholder="Monto R$">
            <button class="btn-gato" onclick="confirmarUQT()">Confirmar Carga</button>
            <button class="btn-gato btn-outline" onclick="cerrarModales()">Cancelar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA58MXpItx1F9zNnJbyeS_4FT_onYx9wig",
            authDomain: "uqt-virtual.firebaseapp.com",
            projectId: "uqt-virtual",
            storageBucket: "uqt-virtual.appspot.com",
            messagingSenderId: "777641217730",
            appId: "1:777641217730:web:8c5b5f9b4c7d8e2a"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let userData = null;
        let adminAttempts = 0;
        let logoClicks = 0;
        const ADMIN_PASS = "AdroCorp..##@@";

        // --- SISTEMA DE RESCATE (LOGOTIPO) ---
        function tripleClic() {
            logoClicks++;
            if (logoClicks >= 3) {
                logoClicks = 0;
                const rescate = prompt("SISTEMA DE RESCATE ADRO CORP.\nIngrese clave maestra para desbloquear:");
                if (rescate === ADMIN_PASS) {
                    localStorage.removeItem('admin_blocked');
                    alert("SISTEMA DESBLOQUEADO CORRECTAMENTE.");
                    location.reload();
                } else {
                    alert("CLAVE ERRÓNEA. APLICANDO PENALIZACIÓN DE R$ 1000.");
                    aplicarPenalizacion();
                }
            }
        }

        async function aplicarPenalizacion() {
            if (auth.currentUser) {
                await db.collection('usuarios_banco').doc(auth.currentUser.uid).update({
                    saldo: firebase.firestore.FieldValue.increment(-1000)
                });
            }
        }

        // --- AUTH ---
        async function crearCuenta() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            if (!email || !pass) return alert("Email y contraseña obligatorios");
            try {
                await auth.createUserWithEmailAndPassword(email, pass);
            } catch (e) { alert("Error: " + e.message); }
        }

        async function completarRegistro() {
            const nombre = document.getElementById('reg-nombre').value;
            const apellido = document.getElementById('reg-apellido').value;
            const alias = document.getElementById('reg-alias').value.trim();
            if (!nombre || !apellido || !alias) return alert("Completa todos los campos");

            const cardNum = "7777 " + Math.floor(1000+Math.random()*8999) + " " + Math.floor(1000+Math.random()*8999) + " " + Math.floor(1000+Math.random()*8999);
            const newUser = {
                uid: auth.currentUser.uid,
                email: auth.currentUser.email,
                nombre, apellido, alias,
                saldo: 0,
                cardNum,
                cvv: Math.floor(100 + Math.random() * 899)
            };
            await db.collection('usuarios_banco').doc(auth.currentUser.uid).set(newUser);
            location.reload();
        }

        function checkAuth() {
            if (localStorage.getItem('admin_blocked') === 'true') document.getElementById('btn-admin-gate').style.display = 'none';
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    const doc = await db.collection('usuarios_banco').doc(user.uid).get();
                    if (doc.exists) {
                        userData = doc.data();
                        document.getElementById('auth-screen').style.display = 'none';
                        document.getElementById('setup-profile').style.display = 'none';
                        document.getElementById('app-screen').style.display = 'flex';
                        escucharDatos();
                    } else {
                        document.getElementById('auth-screen').style.display = 'none';
                        document.getElementById('setup-profile').style.display = 'flex';
                    }
                }
            });
        }

        function escucharDatos() {
            db.collection('usuarios_banco').doc(auth.currentUser.uid).onSnapshot(doc => {
                userData = doc.data();
                document.getElementById('user-name').innerText = userData.nombre;
                document.getElementById('user-alias').innerText = userData.alias;
                document.getElementById('saldo-val').innerText = (userData.saldo < 0 ? 0 : userData.saldo).toLocaleString();
                document.getElementById('card-number').innerText = userData.cardNum;
                document.getElementById('card-holder').innerText = userData.nombre + " " + userData.apellido;
                document.getElementById('card-cvv').innerText = userData.cvv;
            });
        }

        async function iniciarSesion() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(email, pass); } catch (e) { alert("Datos incorrectos"); }
        }

        function accesoAdmin() {
            if (localStorage.getItem('admin_blocked') === 'true') return alert("BLOQUEADO");
            const clave = prompt("Clave Admin:");
            if (clave === ADMIN_PASS) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('admin-screen').style.display = 'flex';
            } else {
                adminAttempts++;
                if (adminAttempts >= 3) {
                    localStorage.setItem('admin_blocked', 'true');
                    location.reload();
                } else alert("Error " + adminAttempts + "/3");
            }
        }

        function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
        function cerrarModales() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
