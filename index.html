<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BancoGato | V 1.0 </title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --verde: #98ff98; --verde-dark: #76d376; --negro: #0a0a0a; --panel: #161616; --texto: #ffffff; --rojo: #ff4d4d; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--negro); color: var(--texto); overflow-x: hidden; }
        
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; background: #1a1a1a; color: var(--verde); border: 1px solid #333; outline: none; box-sizing: border-box; font-size: 1rem; }
        .btn-gato { background: var(--verde); color: #000; border: none; padding: 16px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 10px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-outline { background: transparent; border: 1px solid var(--verde); color: var(--verde); margin-top: 10px; }

        #auth-screen, #app-screen, #setup-profile, #admin-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; }
        .container { width: 100%; max-width: 400px; }

        /* Dashboard */
        .card-saldo { background: linear-gradient(145deg, #161616, #000); padding: 25px; border-radius: 24px; border: 1px solid #222; text-align: center; margin-bottom: 20px; }
        .r-money { font-size: 2.8rem; font-weight: 800; color: var(--verde); }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* GatoCard */
        .gatocard { background: linear-gradient(135deg, #222 0%, #0a0a0a 100%); width: 100%; height: 210px; border-radius: 18px; padding: 25px; position: relative; border: 1px solid rgba(152,255,152,0.3); margin-top: 20px; box-sizing: border-box; }
        .chip { width: 45px; height: 35px; background: linear-gradient(to bottom right, #ffd700, #b8860b); border-radius: 6px; margin-bottom: 30px; }
        .card-num { font-family: 'Courier New', monospace; font-size: 1.2rem; letter-spacing: 2px; }

        /* Admin Styles */
        .admin-box { background: #111; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .admin-item { border-bottom: 1px solid #222; padding: 10px 0; font-size: 0.8rem; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--panel); padding: 30px; border-radius: 20px; border: 1px solid var(--verde); width: 100%; max-width: 380px; }
    </style>
</head>
<body onload="checkAuth()">

    <div id="auth-screen">
        <img src="https://i.postimg.cc/zXxLcyCv/1778560410678-(1).jpg" style="max-width: 150px; margin-bottom: 20px;">
        <h2>BancoGato</h2>
        <div class="container">
            <input type="email" id="email" placeholder="Email de UQT">
            <input type="password" id="pass" placeholder="Tu Contraseña">
            <button class="btn-gato" onclick="iniciarSesion()">Entrar</button>
            <button class="btn-gato btn-outline" onclick="crearCuenta()">Crear Cuenta</button>
            <button id="btn-admin-gate" class="btn-gato btn-outline" style="opacity: 0.4;" onclick="accesoAdmin()">Admin</button>
        </div>
    </div>

    <div id="app-screen" style="display:none;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span>Hola, <b id="user-name">...</b></span>
                <button onclick="logout()" style="color:var(--rojo); background:none; border:none; cursor:pointer;">Cerrar Sesión</button>
            </div>
            <div class="card-saldo">
                <div class="r-money">R$ <span id="saldo-val">0.00</span></div>
                <div style="font-size: 0.7rem; color: var(--verde);">ALIAS: <span id="user-alias">...</span></div>
            </div>
            <div class="grid-buttons">
                <button class="btn-gato mini-btn" onclick="abrirModal('modal-transferir')">💸 Transferir</button>
                <button class="btn-gato mini-btn" onclick="abrirModal('modal-uqtcard')">💳 Cargar UQT</button>
                <button class="btn-gato mini-btn" onclick="abrirModal('modal-sucursal')">📍 Sucursal</button>
                <button class="btn-gato mini-btn" onclick="alert('Próximamente')">🤝 Préstamo</button>
            </div>
            <div class="gatocard">
                <div class="chip"></div>
                <div class="card-num" id="card-number">7777 **** **** ****</div>
                <div style="display:flex; justify-content:space-between; margin-top:40px; font-size:0.7rem;">
                    <div id="card-holder">...</div>
                    <div>CVV: <span id="card-cvv">***</span></div>
                </div>
            </div>
            <h4 style="color:var(--verde); margin-top:20px;">MOVIMIENTOS</h4>
            <div id="lista-movimientos"></div>
        </div>
    </div>

    <div id="modal-uqtcard" class="modal">
        <div class="modal-content">
            <h3>Cargar UQTCard</h3>
            <div id="uqt-step-1">
                <input type="email" id="uqt-email" placeholder="Email del usuario UQT">
                <input type="number" id="uqt-monto" placeholder="Importe R$">
                <button class="btn-gato" onclick="validarUQT()">Siguiente</button>
            </div>
            <div id="uqt-step-2" style="display:none;">
                <p>¿Confirmas cargar R$ <b id="uqt-resumen-monto"></b> al usuario <b id="uqt-resumen-email"></b>?</p>
                <button class="btn-gato" onclick="confirmarUQT()">Confirmar Carga</button>
            </div>
            <button class="btn-gato btn-outline" onclick="cerrarModales()">Cancelar</button>
        </div>
    </div>

    <div id="admin-screen" style="display:none;">
        <h2 style="color:var(--verde);">PANEL CONTROL ADRO CORP</h2>
        <div class="container">
            <div class="admin-box">
                <h4>💵 Dar Plata</h4>
                <input type="text" id="adm-id" placeholder="Alias o N° Tarjeta">
                <input type="number" id="adm-monto" placeholder="Cantidad R$">
                <button class="btn-gato" onclick="adminCargarSaldo()">Inyectar Fondos</button>
            </div>

            <div class="admin-box">
                <h4>🚫 Bloquear Usuario</h4>
                <input type="text" id="adm-block-id" placeholder="Alias o N° Tarjeta">
                <input type="text" id="adm-block-time" placeholder="Tiempo (ej: Permanente)">
                <button class="btn-gato" style="background:var(--rojo);" onclick="adminBloquear()">Bloquear</button>
                <div id="lista-baneados" style="margin-top:10px; font-size:0.7rem;"></div>
            </div>

            <div class="admin-box">
                <h4>📅 Turnos Pendientes</h4>
                <div id="lista-turnos-admin"></div>
            </div>
            <button class="btn-gato btn-outline" onclick="location.reload()">Salir del Panel</button>
        </div>
    </div>

    <div id="modal-transferir" class="modal">
        <div class="modal-content">
            <h3>Transferir</h3>
            <input type="text" id="t-alias" placeholder="Alias">
            <button class="btn-gato" onclick="validarTransferencia()">Continuar</button>
            <button class="btn-gato btn-outline" onclick="cerrarModales()">Cerrar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA58MXpItx1F9zNnJbyeS_4FT_onYx9wig",
            authDomain: "uqt-virtual.firebaseapp.com",
            projectId: "uqt-virtual",
            storageBucket: "uqt-virtual.appspot.com",
            messagingSenderId: "777641217730",
            appId: "1:777641217730:web:8c5b5f9b4c7d8e2a"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let userData = null;
        let adminAttempts = 0;
        const ADMIN_PASS = "AdroCorp..##@@";

        // SEGURIDAD: Bloqueo de opción admin
        function accesoAdmin() {
            if (localStorage.getItem('admin_blocked') === 'true') {
                alert("ACCESO BLOQUEADO PERMANENTEMENTE POR SEGURIDAD");
                return;
            }

            const clave = prompt("Ingrese Clave Maestra:");
            if (clave === ADMIN_PASS) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'none';
                document.getElementById('admin-screen').style.display = 'flex';
                cargarAdminData();
            } else {
                adminAttempts++;
                alert(`Clave incorrecta. Intento ${adminAttempts}/3`);
                if (adminAttempts >= 3) {
                    localStorage.setItem('admin_blocked', 'true');
                    document.getElementById('btn-admin-gate').style.display = 'none';
                }
            }
        }

        // CARGAR UQT CARD
        function validarUQT() {
            const email = document.getElementById('uqt-email').value;
            const monto = parseFloat(document.getElementById('uqt-monto').value);
            if (!email || monto <= 0 || monto > userData.saldo) return alert("Datos inválidos o saldo insuficiente");
            
            document.getElementById('uqt-resumen-email').innerText = email;
            document.getElementById('uqt-resumen-monto').innerText = monto;
            document.getElementById('uqt-step-1').style.display = 'none';
            document.getElementById('uqt-step-2').style.display = 'block';
        }

        async function confirmarUQT() {
            const email = document.getElementById('uqt-email').value;
            const monto = parseFloat(document.getElementById('uqt-monto').value);
            
            const batch = db.batch();
            const selfRef = db.collection('usuarios_banco').doc(auth.currentUser.uid);
            
            batch.update(selfRef, { saldo: firebase.firestore.FieldValue.increment(-monto) });
            batch.set(db.collection('movimientos_banco').doc(), {
                tipo: 'CARGA UQT CARD',
                monto: monto,
                de: userData.alias,
                para: email,
                uids: [auth.currentUser.uid],
                fecha: new Date().toLocaleString()
            });

            await batch.commit();
            alert("Carga de UQTCard completa");
            cerrarModales();
        }

        // FUNCIONES ADMIN
        async function adminCargarSaldo() {
            const id = document.getElementById('adm-id').value;
            const monto = parseFloat(document.getElementById('adm-monto').value);
            
            let query = db.collection('usuarios_banco').where('alias', '==', id);
            if(id.startsWith('7777')) query = db.collection('usuarios_banco').where('cardNum', '==', id);
            
            const snap = await query.get();
            if(snap.empty) return alert("Usuario no encontrado");
            
            await snap.docs[0].ref.update({ saldo: firebase.firestore.FieldValue.increment(monto) });
            alert("Dinero inyectado");
        }

        async function adminBloquear() {
            const id = document.getElementById('adm-block-id').value;
            const tiempo = document.getElementById('adm-block-time').value;
            
            let query = db.collection('usuarios_banco').where('alias', '==', id);
            if(id.startsWith('7777')) query = db.collection('usuarios_banco').where('cardNum', '==', id);
            
            const snap = await query.get();
            if(snap.empty) return alert("Usuario no encontrado");

            await db.collection('baneados').doc(snap.docs[0].id).set({
                alias: snap.docs[0].data().alias,
                cardEnd: snap.docs[0].data().cardNum.slice(-4),
                email: snap.docs[0].data().email,
                tiempo: tiempo
            });
            alert("Usuario baneado");
            cargarAdminData();
        }

        async function cargarAdminData() {
            // Cargar Baneados
            const banSnap = await db.collection('baneados').get();
            const banDiv = document.getElementById('lista-baneados');
            banDiv.innerHTML = "<b>Usuarios Baneados:</b><br>";
            banSnap.forEach(doc => {
                const b = doc.data();
                banDiv.innerHTML += `Alias: ${b.alias} | Tarjeta: ****${b.cardEnd} | ${b.email} <button onclick="quitarBan('${doc.id}')">[Quitar Ban]</button><br>`;
            });

            // Cargar Turnos
            const turnSnap = await db.collection('turnos_banco').get();
            const turnDiv = document.getElementById('lista-turnos-admin');
            turnDiv.innerHTML = "";
            turnSnap.forEach(doc => {
                const t = doc.data();
                turnDiv.innerHTML += `<div class="admin-item">
                    ${t.nombre} ${t.apellido} | ${t.fecha} | ${t.alias} 
                    <button onclick="borrarTurno('${doc.id}')">Borrar</button>
                </div>`;
            });
        }

        async function borrarTurno(id) { await db.collection('turnos_banco').doc(id).delete(); cargarAdminData(); }
        async function quitarBan(id) { await db.collection('baneados').doc(id).delete(); cargarAdminData(); }

        // AUTH & BOILERPLATE
        function checkAuth() {
            if (localStorage.getItem('admin_blocked') === 'true') document.getElementById('btn-admin-gate').style.display = 'none';
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    const doc = await db.collection('usuarios_banco').doc(user.uid).get();
                    if (doc.exists) {
                        userData = doc.data();
                        document.getElementById('auth-screen').style.display = 'none';
                        document.getElementById('app-screen').style.display = 'flex';
                        escucharDatos();
                    } else {
                        document.getElementById('auth-screen').style.display = 'none';
                        document.getElementById('setup-profile').style.display = 'flex';
                    }
                }
            });
        }

        function escucharDatos() {
            db.collection('usuarios_banco').doc(auth.currentUser.uid).onSnapshot(doc => {
                userData = doc.data();
                document.getElementById('user-name').innerText = userData.nombre;
                document.getElementById('user-alias').innerText = userData.alias;
                document.getElementById('saldo-val').innerText = userData.saldo.toLocaleString();
                document.getElementById('card-number').innerText = userData.cardNum;
                document.getElementById('card-holder').innerText = userData.nombre + " " + userData.apellido;
                document.getElementById('card-cvv').innerText = userData.cvv;
            });
        }

        function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
        function cerrarModales() { 
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); 
            document.getElementById('uqt-step-1').style.display = 'block';
            document.getElementById('uqt-step-2').style.display = 'none';
        }
        async function iniciarSesion() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(email, pass); } catch (e) { alert("Error"); }
        }
        function logout() { auth.signOut().then(() => location.reload()); }
    </script>
</body>
</html>
